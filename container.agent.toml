[web]
# This whole-service deployment is owner-only. For shared chat use the host
# supervisor with shared.agent.example.toml and separate worker containers.
host = "0.0.0.0"
port = 7780
state_dir = "/state"
allowed_hosts = ["localhost", "127.0.0.1", "[::1]"]
title = "Agent"
shared_profile = "assistant"

[profiles.assistant]
harness = "claude"
cwd = "/workspace"
