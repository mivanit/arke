name: Arke checks
# workflow_call: the demo site's deploy (pages.yml) runs these first
on: [push, pull_request, workflow_dispatch, workflow_call]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
      - name: Check in an isolated Linux container
        run: make test-container PYTHON_VERSION=${{ matrix.python }}
  harnesses:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # Codex runs commands in a bubblewrap sandbox, which needs unprivileged user namespaces: Ubuntu 24.04 runners
      # restrict them with AppArmor, and Docker's default seccomp/AppArmor profiles block them in the container.
      # Only the network-less test container is loosened.
      - name: Allow unprivileged user namespaces for Codex's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Exercise real Claude and Codex hooks and tmux with scripted model replies
        run: make test-mocked RUN_FLAGS="--security-opt seccomp=unconfined --security-opt apparmor=unconfined"
  deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.local/uv-cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.local/playwright
      TMPDIR: ${{ github.workspace }}/.temp/ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Dependency downloads happen before acceptance. No vendor credentials or
      # subscription homes are supplied; every native worker is network=none.
      # Keep this job separate from harnesses: no sysctl or unconfined profiles.
      - name: Install locked test tools and browser
        run: |
          mkdir -p "$TMPDIR"
          python3 -m venv .temp/ci-tools
          .temp/ci-tools/bin/pip install uv==0.13.4
          npm ci
          npx playwright install --with-deps chromium
      - name: Check the production image, native protocols, and container-backed web agents
        run: make test-deployment UV=.temp/ci-tools/bin/uv
