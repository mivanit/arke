[project]
name = "arke"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = []
license = "GPL-3.0-only"
license-files = ["LICENSE"]

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.16.8", "ty>=0.0.93"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["arke"]

[tool.ty.environment]
extra-paths = ["arke"]

[tool.ruff.lint]
extend-select = ["ANN"]  # every function signature is annotated
ignore = ["ANN401"]  # Any is allowed: JSON bodies and hook events are untyped
